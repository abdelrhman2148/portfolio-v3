name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PUBLIC_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.12.0 deploy --dir=dist --prod --no-build --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Smoke test the live site
        env:
          SITE_URL: https://abdelrhman-fikri-runbook.netlify.app # TODO(owner): switch to the final domain at cutover
        run: |
          set -euo pipefail
          sleep 10
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE_URL$1"); echo "$code $1"; [ "$code" = "$2" ]; }
          check / 200
          check /work/pm-01-self-healing/ 200
          check /work/pm-04-release-setup/ 200
          check /cv.pdf 200
          check /og.png 200
          check /sitemap-index.xml 200
          check /robots.txt 200
          check /this-page-does-not-exist 404
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          curl -s "$SITE_URL/" | grep -q "$sha" && echo "live footer shows $sha"
          curl -sI "$SITE_URL/" | grep -i "x-content-type-options: nosniff"
